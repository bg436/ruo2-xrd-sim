    Fr *= att; Fi *= att;
    const Ar = P.A[2 * i] * att, Ai = P.A[2 * i + 1] * att, Gr = P.G[2 * i], Gi = P.G[2 * i + 1], r = P.r[i];
    const FSr = (Ar * (Gr - 1) - Ai * Gi) / r, FSi = (Ar * Gi + Ai * (Gr - 1)) / r;
    const Is = P.Is0[i] * att * att, If = Fr * Fr + Fi * Fi;
    const lp = P.lp[i];
    tot[i] = (If + Is + 2 * (Fr * FSr + Fi * FSi)) * lp; film[i] = If * lp; sub[i] = Is * lp;
  }
  return { total: tot, film, sub };
}
function gsmooth(y, step, fwhm) {
  if (fwhm <= step) return y;
  const sig = fwhm / (2 * Math.sqrt(2 * Math.log(2))) / step, h = Math.ceil(4 * sig), n = y.length;
  const k = []; let ks = 0;
  for (let i = -h; i <= h; i++) { const v = Math.exp(-0.5 * (i / sig) ** 2); k.push(v); ks += v; }
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let acc = 0;
    for (let j = -h; j <= h; j++) acc += k[j + h] * y[Math.min(n - 1, Math.max(0, i + j))];
    out[i] = acc / ks;
  }
  return out;
}

// ---------------------------------------------------------------- state
const FWHM = 0.01;
const DEF = { profile: 'exponential', ei: +EPS_MATCHED.toFixed(2), es: 0, L: 10, c: 32 };
const S = { scan: SCANS.findIndex(s => s.t === 17), ...DEF, t: 17, showData: true, showSim: true };
let cur = null;   // per-scan cache

function prepScan(k) {
  const sc = SCANS[k], lo = sc.x[0], hi = sc.x[sc.x.length - 1];
  const step = Math.max(0.004, (hi - lo) / 2800);
  const n = Math.floor((hi - lo) / step) + 1, grid = new Float64Array(n);
  for (let i = 0; i < n; i++) grid[i] = lo + i * step;
  const P = precompute(grid), nom = { ...DEF, t: sc.t, c: sc.t / 2 };
  const sim = gsmooth(simulate(P, nom).total, step, FWHM);
  let mx = 0; for (const v of sim) mx = Math.max(mx, v);
  cur = { sc, grid, step, P, scale: sc.ymax / mx, bg: sc.p10 };
}

// ---------------------------------------------------------------- drawing
function setupCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W: r.width, H: r.height };
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawXRD(sim) {
  const { g, W, H } = setupCanvas(document.getElementById('xrd'));
  const fs = Math.max(11, Math.min(18, W / 55));
  const m = { l: fs * 4.2, r: fs * 0.8, t: fs * 2.2, b: fs * 3.2 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const sc = cur.sc, x0 = view ? view[0] : sc.x[0], x1 = view ? view[1] : sc.x[sc.x.length - 1];
  let ylo = sc.ymin, yhi = sc.ymax;
  if (view) {  // fit y to what is visible
    ylo = Infinity; yhi = 0;
    const take = v => { if (v > 0) { ylo = Math.min(ylo, v); yhi = Math.max(yhi, v); } };
    if (S.showData) sc.x.forEach((x, i) => { if (x >= x0 && x <= x1) take(sc.y[i]); });
    if (S.showSim) cur.grid.forEach((x, i) => { if (x >= x0 && x <= x1) take(cur.scale * sim[i] + cur.bg); });
    if (!(yhi > 0)) { ylo = sc.ymin; yhi = sc.ymax; }
  }
  const y0 = Math.log10(ylo * 0.5), y1 = Math.log10(yhi * 5);
  plot = { m, pw, ph, x0, x1 };
  const X = x => m.l + (x - x0) / (x1 - x0) * pw, Y = v => m.t + (1 - (Math.log10(v) - y0) / (y1 - y0)) * ph;
  g.clearRect(0, 0, W, H);
  g.font = `${fs}px -apple-system, Helvetica, Arial`; g.textBaseline = 'middle';
  // grid + ticks
  g.strokeStyle = css('--grid'); g.fillStyle = css('--muted'); g.lineWidth = 1;
  for (let e = Math.ceil(y0); e <= Math.floor(y1); e++) {
    const y = Y(10 ** e); g.beginPath(); g.moveTo(m.l, y); g.lineTo(m.l + pw, y); g.stroke();
    g.textAlign = 'right'; g.fillText(`10${sup(e)}`, m.l - 6, y);
  }
  const span = x1 - x0, dt = [5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01].find(d => span / d >= 5) || 0.01;
  const dec = dt >= 1 ? 0 : dt >= 0.1 ? 1 : 2;
  g.textAlign = 'center';
  for (let k = Math.ceil(x0 / dt - 1e-9); k * dt <= x1 + 1e-9; k++) {
    const x = k * dt;
    g.beginPath(); g.moveTo(X(x), m.t); g.lineTo(X(x), m.t + ph); g.stroke();
    g.fillText(x.toFixed(dec), X(x), m.t + ph + fs * 0.9);
  }
  g.fillStyle = css('--ink');
  g.fillText('2θ (°)', m.l + pw / 2, H - fs * 0.8);
  g.save(); g.translate(fs * 0.9, m.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText('intensity (counts)', 0, 0); g.restore();
  // reference lines
  g.save(); g.beginPath(); g.rect(m.l, m.t, pw, ph); g.clip();
  g.setLineDash([3, 4]); g.lineWidth = 1.2;
  for (const [d, col, name] of [[TIO2.a / 2, '--sub', 'TiO₂ (200)'], [RUO2.a / 2, '--film', 'RuO₂ bulk (200)']]) {
    const x = X(bragg(d)); g.strokeStyle = css(col); g.beginPath(); g.moveTo(x, m.t); g.lineTo(x, m.t + ph); g.stroke();
  }
  g.setLineDash([]);
  // data
  if (S.showData) {
  g.strokeStyle = css('--data'); g.globalAlpha = 0.85; g.lineWidth = 1.4; g.beginPath();
  let pen = false;
  for (let i = 0; i < sc.x.length; i++) {
    if (sc.y[i] <= 0) { pen = false; continue; }
    const px = X(sc.x[i]), py = Y(sc.y[i]); pen ? g.lineTo(px, py) : g.moveTo(px, py); pen = true;
  }
  g.stroke(); g.globalAlpha = 1;
  }
  // simulation
  if (S.showSim) {
  g.strokeStyle = css('--sim'); g.lineWidth = 1.6; g.beginPath();
  for (let i = 0; i < cur.grid.length; i++) {
    const v = cur.scale * sim[i] + cur.bg, px = X(cur.grid[i]), py = Y(v);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.stroke();
  }
  g.restore();
  if (drag && drag.x1 !== undefined) {
    const a = Math.min(drag.x0, drag.x1), b = Math.max(drag.x0, drag.x1);
    g.fillStyle = 'rgba(42,111,219,0.12)'; g.fillRect(a, m.t, b - a, ph);
    g.strokeStyle = 'rgba(42,111,219,0.6)'; g.strokeRect(a, m.t, b - a, ph);
  }
  g.strokeStyle = css('--axis'); g.strokeRect(m.l, m.t, pw, ph);
  // labels for reference lines (above plot)
  g.textAlign = 'center'; g.font = `${fs * 0.85}px -apple-system, Helvetica, Arial`;
  const xs = X(bragg(TIO2.a / 2)), xf = X(bragg(RUO2.a / 2));
  const inside = x => x >= m.l && x <= m.l + pw;
  g.fillStyle = css('--sub'); g.textAlign = 'right'; if (inside(xs)) g.fillText('TiO₂ (200)', xs - 4, m.t - fs * 0.7);
  g.fillStyle = css('--film'); g.textAlign = 'left'; if (inside(xf)) g.fillText('RuO₂ bulk (200)', xf + 4, m.t - fs * 0.7);
  // legend
  g.font = `${fs}px -apple-system, Helvetica, Arial`; g.textAlign = 'left';
  const lx = m.l + pw - fs * 11, ly = m.t + fs * 1.3;
  const items = [];
  if (S.showData) items.push(['--data', `${sc.name} film, lab data`]);
  if (S.showSim) items.push(['--sim', 'simulation']);
  for (const [i, [col, lab]] of items.entries()) {
    g.strokeStyle = css(col); g.lineWidth = 2.5; g.beginPath(); g.moveTo(lx, ly + i * fs * 1.5); g.lineTo(lx + fs * 1.6, ly + i * fs * 1.5); g.stroke();
    g.fillStyle = css('--ink'); g.fillText(lab, lx + fs * 2.1, ly + i * fs * 1.5);
  }
}
const sup = e => String(e).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹⁻'['0123456789-'.indexOf(c)]).join('');

function drawProfile(c) {
  const { g, W, H } = setupCanvas(document.getElementById('prof'));
  const fs = Math.max(10, Math.min(15, W / 26));
  const m = { l: fs * 3.2, r: fs * 0.8, t: fs * 0.9, b: fs * 2.6 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const zmax = c.z[c.z.length - 1] + 0.3;
  let lo = Math.min(-0.25, ...[S.ei, S.es, 0]) - 0.25, hi = Math.max(EPS_MATCHED, S.ei, S.es) + 0.6;
  const X = z => m.l + z / zmax * pw, Y = e => m.t + (1 - (e - lo) / (hi - lo)) * ph;
  g.clearRect(0, 0, W, H);
  g.font = `${fs}px -apple-system, Helvetica, Arial`; g.textBaseline = 'middle';
  g.setLineDash([3, 4]); g.lineWidth = 1;
  for (const [e, col, lab] of [[0, '--muted', 'bulk RuO₂'], [EPS_MATCHED, '--sub', 'TiO₂-matched']]) {
    g.strokeStyle = css(col); g.beginPath(); g.moveTo(m.l, Y(e)); g.lineTo(m.l + pw, Y(e)); g.stroke();
    g.fillStyle = css(col); g.textAlign = 'right'; g.fillText(lab, m.l + pw - 2, Y(e) - fs * 0.6);
  }
  g.setLineDash([]);
  g.strokeStyle = css('--film'); g.lineWidth = 2.2; g.beginPath();
  for (let j = 0; j < c.z.length; j++) { const px = X(c.z[j]), py = Y(100 * c.eps[j]); j ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke();
  g.strokeStyle = css('--axis'); g.strokeRect(m.l, m.t, pw, ph);
  g.fillStyle = css('--muted'); g.textAlign = 'right';
  const st = hi - lo > 3 ? 1 : 0.5;
  for (let e = Math.ceil(lo / st) * st; e <= hi; e += st) g.fillText(e.toFixed(st < 1 ? 1 : 0), m.l - 4, Y(e));
  g.textAlign = 'center';
  const zt = zmax > 40 ? 20 : zmax > 15 ? 5 : zmax > 6 ? 2 : 1;
  for (let z = 0; z <= zmax; z += zt) g.fillText(z, X(z), m.t + ph + fs * 0.8);
  g.fillStyle = css('--ink');
  g.fillText('height above interface (nm)', m.l + pw / 2, H - fs * 0.6);
  g.save(); g.translate(fs * 0.7, m.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText('ε (%)', 0, 0); g.restore();
}

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const sliders = { ei: [v => `${v >= 0 ? '+' : ''}${(+v).toFixed(2)} %`], es: [v => `${v >= 0 ? '+' : ''}${(+v).toFixed(2)} %`],
  L: [v => `${(+v).toFixed(1)} nm`], c: [v => `${(+v).toFixed(1)} nm`], t: [v => `${(+v).toFixed(1)} nm`] };

function seg(el, items, get, set) {
  el.innerHTML = '';
  items.forEach(([val, lab]) => {
    const b = document.createElement('button'); b.textContent = lab;
    b.onclick = () => { set(val); syncUI(); schedule(); };
    b.dataset.v = val; el.appendChild(b);
  });
  el._get = get;
}
function syncUI() {
  for (const el of [$('scans'), $('profiles')]) for (const b of el.children) b.classList.toggle('on', String(el._get()) === b.dataset.v);
  for (const k in sliders) { $(k).value = S[k]; $('v_' + k).textContent = sliders[k][0](S[k]); }
  for (const b of $('show').children) b.classList.toggle('on', S[b.dataset.k]);
  $('c').max = Math.max(S.t, 1);
  $('row_L').classList.toggle('dim', S.profile === 'linear');
  $('row_c').classList.toggle('dim', S.profile !== 'sigmoid');
  $('l_L').textContent = S.profile === 'sigmoid' ? 'transition width' : 'decay length';
}
seg($('scans'), SCANS.map((s, i) => [i, s.t + '']), () => S.scan, v => {
  S.scan = +v; S.t = SCANS[v].t; S.c = S.t / 2; view = null; prepScan(S.scan);
});
seg($('profiles'), [['exponential', 'exponential'], ['sigmoid', 'sigmoid'], ['linear', 'linear']], () => S.profile, v => S.profile = v);
for (const k in sliders) $(k).addEventListener('input', e => { S[k] = +e.target.value; syncUI(); schedule(); });
for (const b of $('show').children) b.onclick = () => { S[b.dataset.k] = !S[b.dataset.k]; syncUI(); schedule(); };
$('reset').onclick = () => { Object.assign(S, DEF, { t: SCANS[S.scan].t, c: SCANS[S.scan].t / 2 }); syncUI(); schedule(); };

// zoom: drag across the plot to zoom into a 2θ range, double-click (or the button) to reset
let view = null, plot = null, drag = null, lastSim = null;
const xcv = $('xrd');
const toTth = px => plot.x0 + (px - plot.m.l) / plot.pw * (plot.x1 - plot.x0);
const localX = e => e.clientX - xcv.getBoundingClientRect().left;
function setView(v) { view = v; $('zoomout').style.display = view ? 'block' : 'none'; if (lastSim) drawXRD(lastSim); }
xcv.addEventListener('pointerdown', e => {
  const x = localX(e);
  if (!plot || x < plot.m.l || x > plot.m.l + plot.pw) return;
  drag = { x0: x }; xcv.setPointerCapture(e.pointerId);
});
xcv.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x1 = Math.min(Math.max(localX(e), plot.m.l), plot.m.l + plot.pw); drawXRD(lastSim);
});
xcv.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.x1 !== undefined && Math.abs(d.x1 - d.x0) > 6) {
    const a = toTth(Math.min(d.x0, d.x1)), b = toTth(Math.max(d.x0, d.x1));
    setView([a, Math.max(b, a + 0.02)]);
  } else drawXRD(lastSim);
});
xcv.addEventListener('dblclick', () => setView(null));
$('zoomout').onclick = () => setView(null);

let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(render); } }
function render() {
  pending = false;
  const p = { ...S }, c = cells(p);
  const sim = gsmooth(simulate(cur.P, p).total, cur.step, FWHM);
  lastSim = sim; drawXRD(sim); drawProfile(c);
  const n = c.eps.length, mean = 100 * c.eps.reduce((a, b) => a + b, 0) / n;
  const grad = 100 * (c.eps[n - 1] - c.eps[0]) / Math.max(c.z[n - 1] - c.z[0], 1e-9);
  $('readout').textContent = `⟨ε⟩ = ${mean >= 0 ? '+' : ''}${mean.toFixed(2)} %   ·   mean dε/dz = ${grad >= 0 ? '+' : ''}${grad.toFixed(3)} %/nm`;
}
window.addEventListener('resize', schedule);
prepScan(S.scan); syncUI(); schedule();
if (window.Office) Office.onReady(() => {});
window._test = { simulate, precompute, DEF, EPS_MATCHED };
</script>
